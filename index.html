<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valeur des engrais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f6b52">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-apple.png">
<!--
  Calculateur autonome tiré du module Engrais de Tournière (29/10/2026).
  Le prix de l'unité de chaque élément se lit sur un engrais de référence par élément (Maxime, 29/10/2026). La valeur
  réelle d'un produit : serveur/13_engrais.valeur_produit (un organique compte pour sa part efficace la 1re année), plus
  pour un organique la valeur de son humus stable (matière organique × K1 du type, comme le module Engrais neuf).
  Un seul fichier, rien à installer : les saisies restent dans ce navigateur.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : une appli de poche. Trois onglets (barre du bas sur téléphone), des listes courtes, une fiche par
   produit qui s'ouvre par-dessus (feuille du bas sur téléphone, panneau à droite sur ordinateur). */
:root {
  --fond: #edf0ec; --surface: #ffffff; --surface-2: #f4f6f3; --encre: #18201b; --doux: #4d5951; --trait: #d6ddd6; --trait-fort: #aab6ad;
  --accent: #1f6b52; --accent-encre: #ffffff; --accent-f: #dcece4;
  --bon: #1f7a47; --bon-f: #dff1e5; --cher: #b03a28; --cher-f: #f8e3df; --att: #8d5d0c; --att-f: #f8ecd4;
  --n: #2f6fae; --p: #b4502f; --k: #7350ad; --mg: #2a8a80; --s: #a88a10; --humus: #6b4f2e;
  --voile: rgba(16, 22, 18, .42); --ombre: 0 10px 40px rgba(16, 22, 18, .18);
  --f-titre: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texte: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-chiffre: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --rayon: 12px; --barre: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #111513; --surface: #1a1f1c; --surface-2: #232a25; --encre: #e9eee9; --doux: #a8b3ab; --trait: #2f3832; --trait-fort: #4f5b53;
    --accent: #62c49f; --accent-encre: #0b1812; --accent-f: #1d3229;
    --bon: #72d39c; --bon-f: #1c3324; --cher: #f1907e; --cher-f: #3b231f; --att: #e7b75e; --att-f: #362c1b;
    --n: #79aee6; --p: #eb9070; --k: #b79cec; --mg: #6fcdc1; --s: #dcc14c; --humus: #c9a57a;
    --voile: rgba(0, 0, 0, .6); --ombre: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #111513; --surface: #1a1f1c; --surface-2: #232a25; --encre: #e9eee9; --doux: #a8b3ab; --trait: #2f3832; --trait-fort: #4f5b53;
  --accent: #62c49f; --accent-encre: #0b1812; --accent-f: #1d3229;
  --bon: #72d39c; --bon-f: #1c3324; --cher: #f1907e; --cher-f: #3b231f; --att: #e7b75e; --att-f: #362c1b;
  --n: #79aee6; --p: #eb9070; --k: #b79cec; --mg: #6fcdc1; --s: #dcc14c; --humus: #c9a57a;
  --voile: rgba(0, 0, 0, .6); --ombre: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.45 var(--f-texte); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chiffre { font-family: var(--f-chiffre); font-variant-numeric: tabular-nums; }
.doux { color: var(--doux); }

/* en-tête */
.tete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--trait); }
.tete-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marque { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.marque b { font: 700 1.3rem/1.1 var(--f-titre); letter-spacing: .01em; }
.marque small { color: var(--doux); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icone { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--trait-fort); background: var(--surface); color: var(--encre); }
.icone:hover { background: var(--surface-2); }
.icone svg { width: 22px; height: 22px; }

/* onglets : en haut sur ordinateur, en bas sur téléphone */
.onglets { display: flex; gap: 4px; }
.onglets button { border: none; background: none; padding: 8px 14px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--doux); font-weight: 600; font-size: .95rem; }
.onglets button svg { width: 22px; height: 22px; display: none; }
.onglets button[aria-selected="true"] { color: var(--accent); background: var(--accent-f); }
@media (max-width: 719px) {
  .onglets { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--trait);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .onglets button { flex: 1; font-size: .78rem; padding: 6px 4px; }
  .onglets button svg { display: block; }
  main { padding-bottom: calc(var(--barre) + 24px + env(safe-area-inset-bottom, 0px)) !important; }
}

main { max-width: 980px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.entete-vue { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 16px; margin-bottom: 14px; }
.entete-vue h1 { font: 700 1.6rem/1.1 var(--f-titre); margin: 0; text-wrap: balance; }
.entete-vue p { margin: 2px 0 0; color: var(--doux); font-size: .92rem; max-width: 60ch; }
.entete-vue .titre { flex: 1 1 260px; min-width: 0; }
.outils { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* boutons : principal (plein), secondaire (contour), suppression (rouge) ; 44 px, 40 px pour « petit » ;
   choix (seg) : l'option choisie en plein, les autres en clair */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 10px;
  border: 1.5px solid var(--trait-fort); background: var(--surface); color: var(--encre); font-weight: 700; font-size: .95rem; line-height: 1.2; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { background: var(--surface-2); border-color: var(--doux); }
.btn.plein { background: var(--accent); border-color: var(--accent); color: var(--accent-encre); }
.btn.plein:hover { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--cher); border-color: color-mix(in srgb, var(--cher) 55%, var(--surface)); }
.btn.danger:hover { background: var(--cher-f); border-color: var(--cher); }
.btn.danger.arme { background: var(--cher); border-color: var(--cher); color: var(--surface); }
.btn.petit { min-height: 40px; padding: 6px 12px; font-size: .9rem; }
.btn.bloc { width: 100%; }

.seg { display: inline-flex; background: var(--surface-2); border: 1.5px solid var(--trait-fort); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: none; background: none; border-radius: 7px; padding: 6px 12px; font-weight: 700; font-size: .9rem; color: var(--encre); min-height: 36px; line-height: 1.2; }
.seg button:hover { background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-encre); }
.seg.large { display: flex; }
.seg.large button { flex: 1; }

/* listes */
.liste { display: grid; gap: 8px; }
.ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; color: var(--encre);
  background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 12px 14px; min-height: 64px; }
.ligne:hover { border-color: var(--doux); }
.ligne .nom { font-weight: 700; font-size: 1.02rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne .bas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .88rem; color: var(--doux); }
.ligne .droite { text-align: right; white-space: nowrap; }
.ligne .gros { font: 600 1.05rem var(--f-chiffre); font-variant-numeric: tabular-nums; }
.ligne .gros small { font-family: var(--f-texte); font-weight: 400; color: var(--doux); font-size: .78rem; margin-left: 2px; }
.ligne.hors { opacity: .62; }
.vide-liste { background: var(--surface); border: 1px dashed var(--trait); border-radius: var(--rayon); padding: 22px; text-align: center; color: var(--doux); }

.formule { font: 500 .86rem var(--f-chiffre); color: var(--encre); background: var(--surface-2); border: 1px solid var(--trait); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.pastille { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.pastille.bon { background: var(--bon-f); color: var(--bon); }
.pastille.cher { background: var(--cher-f); color: var(--cher); }
.pastille.egal { background: var(--surface-2); color: var(--doux); border: 1px solid var(--trait); }
.pastille.att { background: var(--att-f); color: var(--att); font-weight: 600; }
.pastille.ref { background: var(--accent-f); color: var(--accent); }

/* prix de l'unité */
.unites { display: grid; gap: 8px; }
.unite { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 20px; gap: 12px; align-items: center; width: 100%; text-align: left; color: var(--encre);
  background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 12px 14px; min-height: 72px; }
.unite:hover { border-color: var(--doux); }
.unite .sym { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; font: 700 1.15rem var(--f-titre);
  color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--surface)); }
.unite .src { min-width: 0; }
.unite .src b { display: block; font-weight: 700; }
.unite .src span { display: block; color: var(--doux); font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unite .val { font: 600 1.45rem var(--f-chiffre); font-variant-numeric: tabular-nums; text-align: right; }
.unite .val small { display: block; font: 400 .74rem var(--f-texte); color: var(--doux); }
.unite.vide .val { color: var(--doux); }
.chevron { width: 20px; height: 20px; color: var(--doux); }
.note { font-size: .88rem; color: var(--doux); margin: 14px 2px 0; max-width: 65ch; }

/* fiche */
.voile { position: fixed; inset: 0; z-index: 20; background: var(--voile); display: flex; align-items: flex-end; justify-content: center; }
.feuille { background: var(--surface); width: 100%; max-width: 560px; max-height: calc(94% - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column;
  border-radius: 18px 18px 0 0; box-shadow: var(--ombre); animation: monte .2s ease-out; }
@media (min-width: 720px) {
  .voile { justify-content: flex-end; align-items: stretch; }
  .feuille { max-width: 460px; max-height: none; border-radius: 0; animation-name: glisse; }
}
@keyframes monte { from { transform: translateY(24px); opacity: .4; } }
@keyframes glisse { from { transform: translateX(24px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .feuille { animation: none; } }
.feuille-tete { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px 16px; border-bottom: 1px solid var(--trait); }
.feuille-tete h2 { font: 700 1.3rem/1.15 var(--f-titre); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feuille-corps { overflow-y: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 0; overscroll-behavior: contain; }
.feuille-corps > * + * { margin-top: 18px; }
.feuille-corps > .groupe + .groupe, .feuille-corps > .groupe + .pied-fiche, .feuille-corps > details + .pied-fiche, .feuille-corps > .groupe + details { padding-top: 18px; border-top: 1px solid var(--trait); }
.poignee { width: 40px; height: 4px; border-radius: 4px; background: var(--trait); margin: 8px auto 0; }
@media (min-width: 720px) { .poignee { display: none; } }

.bilan { background: var(--surface-2); border: 1.5px solid var(--trait-fort); border-radius: var(--rayon); padding: 14px; display: grid; gap: 10px; }
.bilan .haut { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.bilan .grand { font: 600 1.8rem var(--f-chiffre); font-variant-numeric: tabular-nums; line-height: 1.1; }
.bilan .grand small { font: 400 .85rem var(--f-texte); color: var(--doux); margin-left: 4px; }
.bilan .etiq { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); font-weight: 600; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deux > div { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 10px; display: grid; gap: 4px; align-content: start; }
.detail { width: 100%; border-collapse: collapse; font-size: .88rem; }
.detail td { padding: 4px 0; border-top: 1px solid var(--trait); }
.detail td:not(:first-child) { text-align: right; font-family: var(--f-chiffre); font-variant-numeric: tabular-nums; }
.detail tr.total td { font-weight: 700; }

.groupe { display: grid; gap: 10px; }
.groupe > h3 { margin: 0; font: 700 1.08rem/1.2 var(--f-titre); letter-spacing: .01em; color: var(--encre); display: flex; align-items: baseline; gap: 8px; }
.groupe > h3 small { font: 600 .82rem var(--f-texte); color: var(--doux); }
.champs { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.champs.trois { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.champs .large { grid-column: 1 / -1; }
.champ { display: grid; gap: 4px; min-width: 0; }
.champ > span { font-size: .86rem; color: var(--encre); font-weight: 600; }
.champ input, .champ select { width: 100%; min-height: 46px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--trait-fort); background: var(--surface); color: var(--encre); min-width: 0; }
.champ input:hover, .champ select:hover { border-color: var(--doux); }
.champ input:focus, .champ select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.champ input::placeholder { color: var(--doux); opacity: .75; }
.champ input.num { text-align: right; font-family: var(--f-chiffre); font-variant-numeric: tabular-nums; }
.champ .avec-u { position: relative; display: block; }
.champ .avec-u input { padding-right: 40px; }
.champ .avec-u i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--doux); font-size: .82rem; pointer-events: none; }
.refs { display: grid; gap: 10px; }
.refp { border: 1px solid var(--trait); border-radius: var(--rayon); padding: 12px; display: grid; gap: 10px; background: var(--surface-2); }
.refp-tete { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.refp-tete b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 1.08rem var(--f-titre); }
.champ .seg { min-height: 46px; }
.champ .seg button { min-height: 38px; }
.pied-fiche { display: grid; }
.installer { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 16px; padding: 12px 14px;
  border-radius: var(--rayon); background: var(--accent-f); border: 1.5px solid var(--accent); color: var(--encre); font-size: .92rem; }
.installer svg { width: 26px; height: 26px; color: var(--accent); }
/* onglet Marché : une carte par cours, sa courbe de 3 ans, la bande du milieu (du quart bas au quart haut) */
.cours { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 14px; display: grid; gap: 8px; }
.cours-tete { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px; }
.cours-tete h2 { margin: 0; font: 700 1.15rem/1.2 var(--f-titre); text-wrap: balance; }
.cours-tete .src { display: block; color: var(--doux); font-size: .8rem; margin-top: 2px; }
.cours-val { text-align: right; white-space: nowrap; }
.cours-val b { font: 600 1.45rem/1.1 var(--f-chiffre); font-variant-numeric: tabular-nums; }
.cours-val .u { display: inline; color: var(--doux); font-size: .8rem; margin-left: 3px; }
.cours-val span:not(.u) { display: block; color: var(--doux); font-size: .8rem; margin-top: 2px; }
.cours-bas { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .86rem; color: var(--doux); }
.courbe { position: relative; touch-action: pan-y; }
.courbe svg { display: block; width: 100%; height: auto; }
.courbe .axe { fill: var(--doux); font: 11px var(--f-texte); }
.courbe .grille { stroke: var(--trait); stroke-width: 1; }
.courbe .bande { fill: var(--accent-f); }
.courbe .ligne { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.courbe .point { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.courbe .viseur { stroke: var(--doux); stroke-width: 1; stroke-dasharray: 3 3; }
.bulle { position: absolute; top: 0; pointer-events: none; background: var(--encre); color: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: .8rem; white-space: nowrap; transform: translateX(-50%); }
.bulle b { font-family: var(--f-chiffre); }
.grille-cours { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.reglage-paille { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.puce { min-height: 40px; padding: 6px 14px; border-radius: 99px; border: 1.5px solid var(--trait-fort); background: var(--surface); color: var(--encre); font-weight: 700; font-size: .9rem; }
.puce[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-encre); }
.el-titre, .champ > span.el-titre { font-weight: 700; color: var(--c); }
.bascule { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--trait); border-radius: 10px; background: var(--surface-2); }
.bascule input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.bascule span { font-size: .92rem; }
.aide-champ { font-size: .84rem; color: var(--doux); margin: 0; }
details.plus summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 6px 0; min-height: 36px; display: flex; align-items: center; gap: 8px; list-style: none; }
details.plus summary::-webkit-details-marker { display: none; }
details.plus summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.plus[open] summary::before { transform: rotate(45deg); }
details.plus[open] summary { margin-bottom: 10px; }
.sources { margin: 0; padding-left: 18px; font-size: .9rem; display: grid; gap: 4px; }
.prose { font-size: .95rem; display: grid; gap: 10px; }
.prose p, .prose ol { margin: 0; }
.prose h3 { margin: 6px 0 0; font: 700 1.1rem var(--f-titre); }
.menu { display: grid; gap: 8px; }
.menu .btn { justify-content: flex-start; }
.menu .btn small { display: block; font-weight: 400; color: var(--doux); }

/* message */
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--encre); color: var(--surface); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center;
  box-shadow: var(--ombre); max-width: calc(100% - 32px); font-size: .95rem; }

<script>
"use strict";
const ELEMENTS = ["N", "P2O5", "K2O", "MgO", "SO3"];

const CLE = "tourniere-valeur-engrais-v1";
const VUES = ["prix", "mineraux", "organiques", "paille", "marche"];
// la version de l'appli installable (manifeste valeur-engrais-3) : montrée dans le menu ⋯
const VERSION_APPLI = "5 · 29/10/2026";

// Types d'organiques (module Engrais de Tournière, d'après le COMIFER) : part d'azote efficace au printemps et à
// l'automne ; P₂O₅ 80 %, K₂O 100 % pour tous
const TYPES = [
  {type: "lisier_porc", nom: "Lisier de porc", printemps: 55, automne: 5, unite: "m3"},
  {type: "lisier_bovin", nom: "Lisier de bovin", printemps: 50, automne: 10, unite: "m3"},

  {type: "fumier_porc", nom: "Fumier de porc ou de volailles", printemps: 40, automne: 10},
  {type: "fumier_bovin", nom: "Fumier de bovin, d'ovin ou de cheval", printemps: 25, automne: 10},
  {type: "compost", nom: "Compost", printemps: 10, automne: 5},
  {type: "vinasse", nom: "Vinasse", printemps: 50, automne: 15},

].map(t => ({...t, p2o5: 80, k2o: 100}));
// matière organique habituelle (kg par t ou m³, le bulletin fait foi) et part qui fait de l'humus stable (coefficient
// isohumique K1, %) : SIMEOS-AMG 2019 (Arvalis / Agro-Transfert), comme serveur/13_engrais.MO_TYPES
const MO_TYPES = {lisier_porc: [30, 51], lisier_bovin: [60, 46], digestat: [40, 63], digestat_solide: [200, 63],
  fientes: [450, 41], fumier_porc: [180, 61], fumier_bovin: [200, 67], compost: [250, 72], vinasse: [300, 55],
  boues: [150, 47], boues_papetieres: [250, 61]};
TYPES.forEach(t => { [t.mo, t.k1] = MO_TYPES[t.type] || [null, null]; });
// la paille exportée (Tournière, engrais_tables.prix_plancher_paille, 27/10/2026) : ce qu'elle rendrait enfouie. P₂O₅,
// K₂O, MgO par t (table 2007 du COMIFER, RESIDUS) ; son humus stable : 130 kg par t (K1 0,15 de la matière sèche,
// Arvalis/Onidol 2007, × 87 % de MS) ; moins l'azote que son enfouissement bloque (faim d'azote) : 5 u par t ; t/ha
// vendables courants (PAILLE_T_DEFAUT ; colza, lin et pois ne sont guère pressés : pas de tonnage)
const PAILLES = [
  {cle: "ble", nom: "Blé", P2O5: 1.70, K2O: 12.3, MgO: 0.85, t: 4},
  {cle: "orge", nom: "Orge", P2O5: 1.00, K2O: 12.9, MgO: 0.75, t: 3.5},
  {cle: "avoine", nom: "Avoine", P2O5: 3.00, K2O: 12.0, MgO: 1.00, t: 3.5},
  {cle: "seigle", nom: "Seigle", P2O5: 3.00, K2O: 12.0, MgO: 2.0, t: 4.5},
  {cle: "triticale", nom: "Triticale", P2O5: 2.00, K2O: 10.0, MgO: 2.0, t: 4.5},
  {cle: "colza", nom: "Colza", P2O5: 1.70, K2O: 14.5, MgO: 0.75, t: null},
  {cle: "lin", nom: "Lin", P2O5: 2.05, K2O: 7.20, MgO: 1.30, t: null},
  {cle: "pois", nom: "Pois", P2O5: 2.10, K2O: 19.0, MgO: 2.05, t: null},
];
const PAILLE_HUMUS = 130, PAILLE_N = 5;
// ce qui compte par défaut, comme Tournière sur un sol qui manque de P et K mais pas de MgO
const PAILLE_COMPTE = {P2O5: true, K2O: true, MgO: false, humus: true, N: true};

// € pour 100 kg d'humus stable (engrais_tables.HUMUS_REF : 40-50 €/t, Chambre d'agriculture de la Vienne 2022)
const HUMUS_DEFAUT = 5;
const TYPE = Object.fromEntries(TYPES.map(t => [t.type, t]));

// des engrais du commerce, pour remplir une fiche d'un geste (teneurs en %)
const COURANTS = [
  {nom: "Ammonitrate 33,5", t: {N: 33.5}}, {nom: "Ammonitrate 27", t: {N: 27}}, {nom: "Urée 46", t: {N: 46}},
  {nom: "Solution azotée 30", t: {N: 30}, densite: 1.3},
  {nom: "Solution soufrée 26 + SO₃", t: {N: 26, SO3: 17.5}, densite: 1.27}, {nom: "Sulfate d'ammoniaque", t: {N: 21, SO3: 60}},
  {nom: "TSP 45 (super 45)", t: {P2O5: 45}}, {nom: "18-46 (DAP)", t: {N: 18, P2O5: 46}}, {nom: "11-52 (MAP)", t: {N: 11, P2O5: 52}},
  {nom: "Chlorure de potasse 60", t: {K2O: 60}}, {nom: "Sulfate de potasse", t: {K2O: 50, SO3: 45}},
  {nom: "Kiésérite", t: {MgO: 25, SO3: 50}}, {nom: "Patentkali", t: {K2O: 30, MgO: 10, SO3: 42}},
  {nom: "Polysulfate", t: {K2O: 14, MgO: 6, SO3: 48}}, {nom: "Soufre 90 (pastilles)", t: {SO3: 225}},
  {nom: "0-25-25", t: {P2O5: 25, K2O: 25}}, {nom: "0-20-30", t: {P2O5: 20, K2O: 30}}, {nom: "15-15-15", t: {N: 15, P2O5: 15, K2O: 15}},
];

// les engrais de référence (Maxime, 29/10/2026) : le prix de l'unité de chaque élément se lit sur eux (plusieurs par
// élément possibles : leur moyenne ou le moins cher) ; le soufre et la magnésie n'ont pas de simple courant : ce qui
// reste de leur prix une fois l'autre élément payé
const CALCULS = {moyenne: "Moyenne", mini: "Le moins cher"};
const REFERENCES = [
  {el: "N", nom: "Solution azotée 30", t: {N: 30}, prix: 480},
  {el: "P2O5", nom: "TSP 45 (super 45)", t: {P2O5: 45}, prix: 620},
  {el: "K2O", nom: "Chlorure de potasse 60", t: {K2O: 60}, prix: 430},
  {el: "SO3", nom: "Sulfate d'ammoniaque", t: {N: 21, SO3: 60}, prix: 450},
  {el: "MgO", nom: "Kiésérite", t: {MgO: 25, SO3: 50}, prix: 380},
];

// exemples de départ : les trois azotés de Maxime avec ses prix, le reste en ordre de grandeur, à remplacer
const refsDe = liste => Object.fromEntries(ELEMENTS.map(e => [e, {calcul: "moyenne",
  produits: liste.filter(r => r.el === e).map(({nom, t, prix}) => ({id: nouvelId(), nom, t: {...t}, prix}))}]));
const EXEMPLES = {
  refs: null,       // rempli par complete() d'après REFERENCES
  humus: HUMUS_DEFAUT,
  mineraux: [
    {nom: "Solution azotée 30", t: {N: 30}, prix: 480},
    {nom: "Ammonitrate 27", t: {N: 27}, prix: 450},
    {nom: "Solution 26.6 + SO₃", t: {N: 26.6, SO3: 17.5}, prix: 400},
    {nom: "Super 45", t: {P2O5: 45}, prix: 620},
    {nom: "Chlorure de potasse 60", t: {K2O: 60}, prix: 430},
    {nom: "Soufre 90 (pastilles)", t: {SO3: 225}, prix: 450},
    {nom: "Kiésérite", t: {MgO: 25, SO3: 50}, prix: 380},
    {nom: "18-46 (DAP)", t: {N: 18, P2O5: 46}, prix: 780},
    {nom: "0-25-25", t: {P2O5: 25, K2O: 25}, prix: 520},
    {nom: "Patentkali", t: {K2O: 30, MgO: 10, SO3: 42}, prix: 560},
  ],
  organiques: [
    {nom: "Fumier de bovin", type: "fumier_bovin", unite: "t", t: {N: 6, P2O5: 3, K2O: 9, MgO: 1.5, SO3: 1.5}, prix: 15, epandage: 6, dose: 25},
    {nom: "Digestat liquide", type: "digestat", unite: "m3", t: {N: 5, P2O5: 1.8, K2O: 5}, prix: 3, epandage: 5, dose: 30},
    {nom: "Vinasse", type: "vinasse", unite: "t", t: {N: 30, P2O5: 4, K2O: 55, SO3: 12}, prix: 70, epandage: 0, dose: 2},
  ],
};

// ---------------------------------------------------------------- outils
function nombre(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return isFinite(v) ? v : null;
  const x = parseFloat(String(v).replace(/\s/g, "").replace(",", ".").replace(/[^\d.\-]/g, ""));
  return isFinite(x) ? x : null;
}
const f0 = new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 0});
const f1 = new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 1});
const f2 = new Intl.NumberFormat("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const champTxt = v => v === null || v === undefined ? "" : String(v).replace(".", ",");
const echap = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const parU = o => o.unite === "m3" ? "m³" : "t";
const nouvelId = () => Math.random().toString(36).slice(2, 9);
const $ = s => document.querySelector(s);
const CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';

function lire(cle) { try { return localStorage.getItem(cle); } catch (e) { return null; } }
function ecrire(cle, v) { try { localStorage.setItem(cle, v); } catch (e) { /* navigation privée : rien de gardé */ } }

// un état d'avant les engrais de référence (ou un fichier incomplet) : ce qui manque, d'après les exemples
function complete(d) {
  // plus que les engrais de référence (Maxime, 29/10/2026) : l'ancien mode « d'après mes engrais » et les prix imposés
  // d'un fichier d'avant sont oubliés
  delete d.mode;
  delete d.prixImposes;
  d.mineraux.forEach(p => { delete p.compte; });
  if (nombre(d.humus) === null) d.humus = HUMUS_DEFAUT;
  d.paille = d.paille && typeof d.paille === "object" ? d.paille : {};
  d.paille.compte = {...PAILLE_COMPTE, ...(d.paille.compte || {})};
  d.paille.cultures = d.paille.cultures || {};
  // un état d'avant (un engrais de référence par élément, d.references) : chacun devient le seul de son élément
  if (!d.refs || typeof d.refs !== "object") {
    const anciens = Array.isArray(d.references) ? d.references : [];
    d.refs = refsDe(REFERENCES.map(r => anciens.find(y => y && y.el === r.el && y.t) || r));
  }
  delete d.references;
  const sol39 = r => { const k = Object.keys(r.t || {}).filter(e => nombre(r.t[e]) > 0); if (k.length === 1 && k[0] === "N" && nombre(r.t.N) === 39) { r.t = {N: 30}; r.prixPar = "m3"; r.densite = 1.3; } };
  for (const e of ELEMENTS) {
    const x = d.refs[e] = d.refs[e] || {calcul: "moyenne", produits: []};
    x.calcul = x.calcul === "mini" ? "mini" : "moyenne";
    x.produits = (Array.isArray(x.produits) ? x.produits : []).filter(Boolean);
    x.produits.forEach(r => { r.t = r.t || {}; r.id = r.id || nouvelId(); sol39(r); });
  }
  d.mineraux.forEach(p => { p.t = p.t || {}; p.id = p.id || nouvelId(); sol39(p); });
  d.organiques.forEach(o => { o.t = o.t || {}; o.id = o.id || nouvelId(); });
  return d;
}
function charger() {
  try {
    const d = JSON.parse(lire(CLE));
    if (d && Array.isArray(d.mineraux) && Array.isArray(d.organiques)) return complete(d);
  } catch (e) { /* rien de lisible : les exemples */ }
  return complete(structuredClone(EXEMPLES));
}
let etat = charger();
const sauver = () => ecrire(CLE, JSON.stringify(etat));

// ---------------------------------------------------------------- prix à la tonne ou au m³
// les teneurs sont toujours en % du poids ; un liquide peut se payer au m³ (« solution 39 » = la solution 30 au m³ :
// 30 % × 1,3 = 390 u par m³) : son prix à la tonne = prix au m³ ÷ densité
const DENSITE_DEFAUT = 1.3;
const auM3 = p => p.prixPar === "m3";
const densite = p => nombre(p.densite) > 0 ? nombre(p.densite) : DENSITE_DEFAUT;
const prixTonne = p => { const v = nombre(p.prix); return v === null ? null : auM3(p) ? v / densite(p) : v; };
const facteur = p => auM3(p) ? densite(p) : 1;          // de « par t » à « par unité de prix »
const uPrix = p => auM3(p) ? "m³" : "t";

// ---------------------------------------------------------------- le calcul (repris de Tournière)
// u par tonne d'un minéral
function unitesMineral(p) {
  const o = {};
  for (const e of ELEMENTS) { const v = nombre(p.t[e]); if (v > 0) o[e] = v * 10; }
  return o;
}

// le prix de l'unité, d'après les engrais de référence : chacun paie son élément une fois les autres payés (le sulfate
// d'ammoniaque après la solution 30, la kiésérite après le soufre) ; un reste négatif compte pour 0. Plusieurs engrais
// pour un élément : leur moyenne, ou le moins cher. Un élément attend que tous ses engrais puissent se calculer ; s'il
// reste bloqué (une référence circulaire), il se calcule avec ceux qui le peuvent.
function prixUnite() {
  const connus = {}, detail = {};
  const prets = e => etat.refs[e].produits.filter(r => prixTonne(r) > 0 && unitesMineral(r)[e] > 0);
  const evaluer = (e, strict) => {
    const tous = prets(e);
    const ps = tous.filter(r => Object.keys(unitesMineral(r)).every(k => k === e || k in connus));
    if (!ps.length || (strict && ps.length < tous.length)) return false;
    const xs = ps.map(r => {
      const u = unitesMineral(r), prix = prixTonne(r), autres = Object.keys(u).filter(k => k !== e);
      const deja = autres.reduce((s, k) => s + connus[k] * u[k], 0);
      return {id: r.id, nom: r.nom, x: Math.max(0, (prix - deja) / u[e]),
        calcul: (autres.length ? `(${f0.format(prix)} € − ${autres.map(k => `${f0.format(u[k])} u ${NOMS[k]} × ${f2.format(connus[k])} €`).join(" − ")}) ÷ ${f0.format(u[e])} u`
          : `${f0.format(prix)} € ÷ ${f0.format(u[e])} u`) + (auM3(r) ? ` (${f0.format(nombre(r.prix))} €/m³ ÷ ${f2.format(densite(r))})` : "")};
    });
    const mini = etat.refs[e].calcul === "mini";
    const v = mini ? Math.min(...xs.map(o => o.x)) : xs.reduce((s, o) => s + o.x, 0) / xs.length;
    connus[e] = v;
    detail[e] = {prix: v, sources: xs, mini, attente: tous.length - ps.length,
      methode: xs.length === 1 ? xs[0].nom : mini ? `le moins cher de ${xs.length} engrais` : `moyenne de ${xs.length} engrais`};
    return true;
  };
  for (const strict of [true, false]) {
    for (let encore = true; encore;) {
      encore = false;
      for (const e of ELEMENTS) if (!(e in connus) && evaluer(e, strict)) encore = true;
    }
  }
  for (const e in detail) detail[e].prix = Math.round(detail[e].prix * 1000) / 1000;
  return detail;
}

// serveur/13_engrais.valeur_produit : sans valeur s'il manque le prix d'un élément ; un organique compte pour sa part
// efficace la 1re année
function valeurMineral(p, pe) {
  let total = 0;
  const u = unitesMineral(p), manque = [], lignes = [];
  for (const [e, v] of Object.entries(u)) {
    if (!pe[e]) { manque.push(e); continue; }
    total += v * pe[e].prix;
    lignes.push({e, u: v, pu: pe[e].prix, euros: v * pe[e].prix});
  }
  return manque.length ? {manque} : {valeur: total, unites: u, lignes};
}

function partsOrganique(o) {
  const ty = TYPE[o.type] || {};
  const pick = (v, d) => nombre(v) !== null ? nombre(v) : d;
  return {printemps: pick(o.eff_printemps, ty.printemps), automne: pick(o.eff_automne, ty.automne),
          P2O5: pick(o.eff_p2o5, ty.p2o5), K2O: pick(o.eff_k2o, ty.k2o)};
}

// kg d'humus stable par t (ou m³) : sa matière organique (fiche, sinon son type) × K1 (fiche, sinon son type)
function humusOrganique(o) {
  const ty = TYPE[o.type] || {};
  const mo = nombre(o.mo) !== null ? nombre(o.mo) : ty.mo, k1 = nombre(o.k1) !== null ? nombre(o.k1) : ty.k1;
  if (!(mo > 0) || !(k1 > 0)) return null;
  return {kg: mo * k1 / 100, mo, k1, euros: mo * k1 / 100 * (nombre(etat.humus) || 0) / 100};
}

function valeurOrganique(o, pe, saison) {
  const parts = partsOrganique(o);
  let total = 0, plein = 0;
  const manque = [], lignes = [];
  for (const e of ELEMENTS) {
    const v = nombre(o.t[e]);
    if (!(v > 0)) continue;
    if (!pe[e]) { manque.push(e); continue; }
    let part = 100;
    if (e === "N") {
      const a = saison === "printemps" ? parts.printemps : parts.automne, b = saison === "printemps" ? parts.automne : parts.printemps;
      part = a !== undefined && a !== null ? a : b;
    } else if (e === "P2O5" || e === "K2O") part = parts[e];
    part = part === undefined || part === null ? 100 : part;
    total += v * part / 100 * pe[e].prix;
    plein += v * pe[e].prix;
    lignes.push({e, u: v * part / 100, part, pu: pe[e].prix, euros: v * part / 100 * pe[e].prix});
  }
  if (manque.length) return {manque};
  const h = humusOrganique(o);
  return {valeur: total + (h ? h.euros : 0), elements: total, humus: h, plein: plein + (h ? h.euros : 0), lignes};
}

// la valeur de la paille exportée, par t : ce qu'elle rendrait enfouie (P, K, MgO s'ils comptent, son humus), moins
// l'azote que son enfouissement bloque ; sous ce prix, la garder rapporte plus que la vendre
function paille(c) {
  const reg = etat.paille.cultures[c.cle] || {}, compte = etat.paille.compte, pe = prixUnite();
  const val = k => nombre(reg[k]) !== null ? nombre(reg[k]) : c[k];
  const lignes = [], manque = [];
  for (const e of ["P2O5", "K2O", "MgO"]) {
    if (!compte[e]) continue;
    if (!pe[e]) { manque.push(e); continue; }
    lignes.push({e, u: val(e), pu: pe[e].prix, euros: val(e) * pe[e].prix});
  }
  const humusKg = nombre(reg.humus) !== null ? nombre(reg.humus) : PAILLE_HUMUS;
  const humus = compte.humus ? humusKg * (nombre(etat.humus) || 0) / 100 : 0;
  let azote = 0;
  if (compte.N) { if (pe.N) azote = -PAILLE_N * pe.N.prix; else manque.push("N"); }
  const total = lignes.reduce((s, l) => s + l.euros, 0) + humus + azote;
  const t = nombre(reg.t) !== null ? nombre(reg.t) : c.t;
  return {lignes, humus, humusKg, azote, total: Math.max(0, total), brut: total, manque, t, val};
}

// ---------------------------------------------------------------- petits morceaux d'affichage
// la notation des sacs : N-P-K, puis MgO et SO₃ en plus
function formule(t) {
  const v = e => nombre(t[e]) || 0, f = x => f1.format(x);
  if (!ELEMENTS.some(e => v(e) > 0)) return "";
  let s = `${f(v("N"))}-${f(v("P2O5"))}-${f(v("K2O"))}`;
  if (v("MgO")) s += ` +${f(v("MgO"))} MgO`;
  if (v("SO3")) s += ` +${f(v("SO3"))} SO₃`;
  return s;
}
function teneursOrg(o) {
  return ELEMENTS.filter(e => nombre(o.t[e]) > 0).map(e => `${NOMS[e]} ${f1.format(nombre(o.t[e]))}`).join(" · ");
}
function ecartMineral(prix, valeur) {
  if (prix === null || !(valeur > 0)) return null;
  return (prix / valeur - 1) * 100;
}
function pastilleEcart(ec) {
  if (ec === null) return "";
  if (Math.abs(ec) < 3) return '<span class="pastille egal">au prix de référence</span>';
  return ec > 0 ? `<span class="pastille cher">${f0.format(ec)} % plus cher</span>` : `<span class="pastille bon">${f0.format(-ec)} % moins cher</span>`;
}
const pastilleManque = m => `<span class="pastille att">sans prix pour ${m.map(e => NOMS[e]).join(", ")}</span>`;
function pastilleGain(gain, u) {
  const cls = gain > 0.05 ? "bon" : gain < -0.05 ? "cher" : "egal";
  return `<span class="pastille ${cls}">${f1.format(Math.abs(gain))} € de ${gain >= 0 ? "gain" : "perte"} / ${u}</span>`;
}
// la place de l'unité écrite dans la case, pour qu'elle ne recouvre jamais le chiffre
const placeU = u => u ? ` style="padding-right:calc(${u.length * 0.85}ch + 16px)"` : "";
function champ({cle, titre, val, u, num = true, ph = "", large = false, attrs = ""}) {
  const input = `<input id="c-${cle}" data-k="${cle}" ${num ? 'class="num" inputmode="decimal"' : ""} value="${echap(champTxt(val))}" placeholder="${echap(ph)}" ${attrs}${placeU(u)} autocomplete="off">`;
  return `<label class="champ ${large ? "large" : ""}"><span>${titre}</span>${u ? `<span class="avec-u">${input}<i>${u}</i></span>` : input}</label>`;
}
function champsTeneurs(t, u, prefixe = "t") {
  return ELEMENTS.map(e => `<label class="champ"><span class="el-titre" style="--c:${COULEURS[e]}">${NOMS[e]}</span><span class="avec-u"><input id="c-${prefixe}-${e}" class="num" inputmode="decimal" data-t="${e}" value="${echap(champTxt(t[e]))}" placeholder="0"${placeU(u)} autocomplete="off"><i>${u}</i></span></label>`).join("");
}

let vue = VUES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "prix";
let tri = lire(CLE + "-tri") === "nom" ? "nom" : "affaire";

// l'installation proposée par la page elle-même (29/10/2026) : le menu ⋮ de Chrome disait l'appli « déjà installée »
// parce que d'autres applis (Jalon, Carnet de mise) sont installées à la même adresse (malakit51.github.io) ; la
// fenêtre d'installation que la page déclenche ne fait pas ce test. Chrome ne la permet que s'il juge l'appli
// installable et pas encore installée (événement beforeinstallprompt).
let invitation = null;
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); invitation = ev; dessiner(); });
window.addEventListener("appinstalled", () => { invitation = null; dessiner(); message("Appli installée : elle est sur ton écran d'accueil."); });
function bandeauInstall() {
  if (!invitation) return "";
  return `<div class="installer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    <span><b>Installer sur ton téléphone</b><br>Une icône sur l'écran d'accueil, en plein écran, même sans réseau.</span>
    <button class="btn plein petit" data-action="installer">Installer</button></div>`;
}
async function installer() {
  if (!invitation) { message("Chrome ne propose pas l'installation ici."); return; }
  const ev = invitation;
  invitation = null;
  await ev.prompt();
  const choix = await ev.userChoice.catch(() => null);
  if (!choix || choix.outcome !== "accepted") message("Installation annulée.");
  dessiner();
}

function dessiner() {
  document.querySelectorAll("#onglets [data-vue]").forEach(b => b.setAttribute("aria-selected", b.dataset.vue === vue ? "true" : "false"));
  $("#sous-titre").textContent = "Valeur réelle, pas valeur vénale";

  $("#vue").innerHTML = bandeauInstall() + (vue === "prix" ? vuePrix(pe) : vue === "mineraux" ? vueMineraux(pe) : vue === "organiques" ? vueOrganiques(pe) : vue === "paille" ? vuePaille(pe) : vueMarche());

}

function vueMineraux(pe) {

  return `<div class="entete-vue"><div class="titre"><h1>Engrais minéraux</h1>

    <div class="outils"><div class="seg" role="group" aria-label="Trier"><button data-tri="affaire" aria-pressed="${tri === "affaire"}">Meilleure affaire</button><button data-tri="nom" aria-pressed="${tri === "nom"}">Nom</button></div>
      <button class="btn plein" data-ajoute="min">${IC_PLUS}Ajouter</button></div></div>
    <div class="liste">${lignes || '<div class="vide-liste">Aucun engrais minéral. Ajoute le premier : un engrais courant se remplit en un geste.</div>'}</div>`;

function vueOrganiques(pe) {
  const lignes = etat.organiques.map(o => {
    const u = parU(o), r = valeurOrganique(o, pe, "printemps"), ra = valeurOrganique(o, pe, "automne");

// ---------------------------------------------------------------- onglet Marché
// donnees/cours.json, écrit chaque lundi par le relevé (GitHub Actions, outils/releve.py) : sources ouvertes, mensuelles
let marche = {etat: "rien"};
const ORDRE_COURS = ["uree", "ipampa_n", "tsp", "kcl", "dap", "gaz"];
const ETATS_COURS = {bas: ["bon", "quart le plus bas sur 3 ans"], moyen: ["egal", "dans la moyenne sur 3 ans"], haut: ["cher", "quart le plus haut sur 3 ans"]};
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const moisTxt = m => `${MOIS[+m.slice(5) - 1]} ${m.slice(0, 4)}`;

async function chargerMarche() {
  marche = {etat: "charge"};
  try {
    const r = await fetch("donnees/cours.json", {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    marche = {etat: "ok", d: await r.json()};
  } catch (e) {
    marche = {etat: "erreur"};
  }
  if (vue === "marche") dessiner();
}

function couleurCours(s) { return s.cle === "gaz" ? "var(--doux)" : COULEURS[s.element] || "var(--accent)"; }

// la courbe des 3 dernières années : bande du milieu (quart bas → quart haut), grille légère, point final marqué
function courbe(s) {
  const pts = s.points.slice(-(marche.d.fenetre_mois || 36)), g = s.signal;
  const L = 340, H = 130, g0 = 34, d0 = 8, h0 = 8, b0 = 20;
  const vals = pts.map(p => p[1]), mn = Math.min(...vals), mx = Math.max(...vals), marge = (mx - mn) * 0.08 || 1;
  const y0 = mn - marge, y1 = mx + marge;
  const X = i => g0 + i * (L - g0 - d0) / Math.max(1, pts.length - 1), Y = v => h0 + (y1 - v) * (H - h0 - b0) / (y1 - y0);
  const ticks = [mn, (mn + mx) / 2, mx];
  const annees = pts.map((p, i) => [p[0], i]).filter(([m]) => m.endsWith("-01"));
  const chemin = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const dernier = pts.length - 1;
  return `<div class="courbe" data-courbe="${s.cle}" style="--c:${couleurCours(s)}">
    <svg viewBox="0 0 ${L} ${H}" role="img" aria-label="${echap(s.nom)} sur 3 ans, de ${f0.format(mn)} à ${f0.format(mx)} ${echap(s.unite)}">
      ${g ? `<rect class="bande" x="${g0}" y="${Y(g.q75).toFixed(1)}" width="${L - g0 - d0}" height="${Math.max(1, Y(g.q25) - Y(g.q75)).toFixed(1)}"/>` : ""}
      ${ticks.map(t => `<line class="grille" x1="${g0}" x2="${L - d0}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="axe" x="${g0 - 4}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${f0.format(t)}</text>`).join("")}
      ${annees.map(([m, i]) => `<text class="axe" x="${X(i).toFixed(1)}" y="${H - 4}" text-anchor="middle">${m.slice(0, 4)}</text>`).join("")}
      <path class="ligne" d="${chemin}"/>
      <line class="viseur" data-viseur x1="0" x2="0" y1="${h0}" y2="${H - b0}" visibility="hidden"/>
      <circle class="point" data-curseur r="5" cx="${X(dernier).toFixed(1)}" cy="${Y(pts[dernier][1]).toFixed(1)}"/>
    </svg><div class="bulle" data-bulle hidden></div></div>`;
}

function carteCours(s) {
  const g = s.signal, dernier = s.points[s.points.length - 1];
  if (!dernier) return "";
  const parU = s.teneur && s.unite === "€/t" ? `soit ${f2.format(dernier[1] / (s.teneur * 10))} €/u ${NOMS[s.element]}` : "";
  const [cls, txt] = g ? ETATS_COURS[g.etat] : ["egal", ""];
  return `<article class="cours">
    <div class="cours-tete"><div><h2>${echap(s.nom)}</h2><span class="src">${echap(s.lieu)} · ${echap(s.source)}</span></div>
      <div class="cours-val"><b>${f0.format(dernier[1])}</b><span class="u">${echap(s.unite.replace(" (100 en 2020)", ""))}</span><span>${moisTxt(dernier[0])}</span>${parU ? `<span>${parU}</span>` : ""}</div></div>
    ${courbe(s)}
    <div class="cours-bas">${g ? `<span class="pastille ${cls}">${txt}</span><span>${g.var1 >= 0 ? "+" : "−"}${f1.format(Math.abs(g.var1))} % sur un mois</span><span>${g.var12 >= 0 ? "+" : "−"}${f1.format(Math.abs(g.var12))} % sur un an</span>` : ""}</div>
  </article>`;
}

function vueMarche() {
  if (marche.etat === "rien") chargerMarche();
  const tete = `<div class="entete-vue"><div class="titre"><h1>Marché</h1>
      <p>Les cours mondiaux et les prix payés en France, mois par mois, sur 3 ans. La bande verte va du quart le plus bas au quart le plus haut : sous elle, c'est le moment de regarder.</p></div></div>`;
  if (marche.etat === "charge" || marche.etat === "rien") return tete + '<div class="vide-liste">Chargement des cours…</div>';
  if (marche.etat === "erreur") return tete + `<div class="vide-liste">Les cours se lisent dans l'appli installée (malakit51.github.io/Valeur-engrais), avec du réseau la première fois.<br><br><button class="btn" data-action="recharger-marche">Réessayer</button></div>`;
  const d = marche.d, par = Object.fromEntries(d.series.map(s => [s.cle, s]));
  const cartes = ORDRE_COURS.filter(k => par[k]).map(k => carteCours(par[k])).join("");
  return tete + `<div class="grille-cours">${cartes}</div>
    <p class="note">Relevé le ${new Date(d.maj).toLocaleDateString("fr-FR")}, chaque lundi. Banque mondiale (Pink Sheet, CC BY 4.0), en euros au taux mensuel de la BCE ; INSEE, indice IPAMPA (Licence Ouverte). Ce sont des cours de gros mondiaux et un indice national : ils donnent la tendance et le bon moment, ton prix livré suit avec un décalage. Une alerte arrive par GitHub quand un cours passe dans le quart le plus bas ou baisse de 8 % en un mois.</p>`;
}

// le doigt (ou la souris) sur une courbe : le mois et le cours
function brancherCourbes() {
  if (marche.etat !== "ok") return;
  const par = Object.fromEntries(marche.d.series.map(s => [s.cle, s]));
  document.querySelectorAll("[data-courbe]").forEach(box => {
    const s = par[box.dataset.courbe], pts = s.points.slice(-(marche.d.fenetre_mois || 36));
    const svg = box.querySelector("svg"), viseur = box.querySelector("[data-viseur]"), point = box.querySelector("[data-curseur]"), bulle = box.querySelector("[data-bulle]");
    const L = 340, g0 = 34, d0 = 8, fin = {cx: point.getAttribute("cx"), cy: point.getAttribute("cy")};
    const ys = [...svg.querySelector(".ligne").getAttribute("d").matchAll(/[ML]([\d.]+),([\d.]+)/g)].map(m => [+m[1], +m[2]]);
    const montrer = ev => {
      const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * L / r.width;
      const i = Math.max(0, Math.min(pts.length - 1, Math.round((x - g0) / ((L - g0 - d0) / Math.max(1, pts.length - 1)))));
      const [cx, cy] = ys[i];
      viseur.setAttribute("x1", cx); viseur.setAttribute("x2", cx); viseur.setAttribute("visibility", "visible");
      point.setAttribute("cx", cx); point.setAttribute("cy", cy);
      bulle.hidden = false;
      bulle.innerHTML = `${moisTxt(pts[i][0])} · <b>${f0.format(pts[i][1])}</b> ${echap(s.unite)}`;
      bulle.style.left = `${Math.min(Math.max(cx * r.width / L, 60), r.width - 60)}px`;
    };
    const cacher = () => { viseur.setAttribute("visibility", "hidden"); point.setAttribute("cx", fin.cx); point.setAttribute("cy", fin.cy); bulle.hidden = true; };
    box.addEventListener("pointermove", montrer);
    box.addEventListener("pointerdown", montrer);
    box.addEventListener("pointerleave", cacher);
    box.addEventListener("pointerup", ev => { if (ev.pointerType !== "mouse") setTimeout(cacher, 1500); });
  });
}

function vuePaille() {
  const compte = etat.paille.compte;
  const puces = [["P2O5", "P₂O₅"], ["K2O", "K₂O"], ["MgO", "MgO"], ["humus", "Humus"], ["N", "Azote bloqué"]]
    .map(([k, t]) => `<button class="puce" data-compte="${k}" aria-pressed="${!!compte[k]}">${compte[k] ? "✓ " : ""}${t}</button>`).join("");

    return `<button class="ligne" data-ouvre="paille:${c.cle}">

  }).join("");
  return `<div class="entete-vue"><div class="titre"><h1>Paille exportée</h1>
      <p>Ce que la paille rendrait si elle restait au champ : ses éléments, son humus, moins l'azote que son enfouissement bloque. Sous ce prix, la garder rapporte plus que la vendre.</p></div></div>
    <div class="reglage-paille"><span class="doux">Compter :</span>${puces}</div>
    <div class="liste">${lignes}</div>
    <p class="note">${compte.P2O5 || compte.K2O ? "" : "P₂O₅ et K₂O décochés : ton sol en est riche, leur exportation ne coûte rien. "}Coche un élément seulement si ton sol en manque : sur un sol riche, l'exporter ne coûte rien (Tournière ne compte le MgO que sur sol faible). Touche une culture pour changer ses teneurs ou son tonnage.</p>`;
}

// ---------------------------------------------------------------- les fiches
let fiche = null;       // {genre: "min" | "org" | "el" | "menu" | "methode", id, neuf}
let dernierFocus = null;

function objetFiche() {
  if (!fiche) return null;
  if (fiche.genre === "min") return etat.mineraux.find(p => p.id === fiche.id);
  if (fiche.genre === "org") return etat.organiques.find(o => o.id === fiche.id);
  if (fiche.genre === "el") return etat.refs[fiche.id];
  if (fiche.genre === "paille") return etat.paille.cultures[fiche.id] = etat.paille.cultures[fiche.id] || {};
  return null;
}

function ouvrir(genre, id, neuf = false) {
  dernierFocus = document.activeElement;
