function fermer() {
  if (!fiche) return;
  // une fiche neuve laissée vide ne garde rien
  const o = objetFiche();
  if (fiche.neuf && o && !ELEMENTS.some(e => nombre(o.t[e]) > 0) && nombre(o.prix) === null) {
    const liste = fiche.genre === "min" ? etat.mineraux : etat.organiques;
    liste.splice(liste.indexOf(o), 1);
    sauver();
  }
  fiche = null;
  $("#voile").hidden = true;
  document.body.style.overflow = "";
  dessiner();
  if (dernierFocus && document.contains(dernierFocus)) dernierFocus.focus({preventScroll: true});
}

function teteFiche(titre) {
  return `<div class="poignee"></div><div class="feuille-tete"><h2 id="feuille-titre">${echap(titre)}</h2>
    <button class="btn plein" data-ferme>OK</button></div>`;
}

function dessinerFiche() {
  const f = $("#feuille");
  const o = objetFiche();
  if (fiche.genre === "min") f.innerHTML = teteFiche(o.nom || "Nouvel engrais") + `<div class="feuille-corps">${ficheMineral(o)}</div>`;
  else if (fiche.genre === "org") f.innerHTML = teteFiche(o.nom || "Nouvel organique") + `<div class="feuille-corps">${ficheOrganique(o)}</div>`;
  else if (fiche.genre === "el") f.innerHTML = teteFiche(NOMS_LONGS[fiche.id] + " · " + NOMS[fiche.id]) + `<div class="feuille-corps">${ficheElement(fiche.id)}</div>`;
  else if (fiche.genre === "humus") f.innerHTML = teteFiche("Humus stable") + `<div class="feuille-corps">${ficheHumus()}</div>`;
  else if (fiche.genre === "paille") f.innerHTML = teteFiche("Paille de " + PAILLES.find(c => c.cle === fiche.id).nom.toLowerCase()) + `<div class="feuille-corps">${fichePaille(fiche.id)}</div>`;
  else if (fiche.genre === "menu") f.innerHTML = teteFiche("Mes engrais") + `<div class="feuille-corps">${ficheMenu()}</div>`;
  else f.innerHTML = teteFiche("Comment c'est calculé") + `<div class="feuille-corps">${ficheMethode()}</div>`;
  majFiche();
}

// la richesse au volume d'un liquide payé au m³ : « 30 % × 1,3 = 390 u d'azote par m³ (la solution 39) »
function texteVolume(p) {
  const els = ELEMENTS.filter(e => nombre(p.t[e]) > 0);
  if (!els.length) return "";
  return `Au volume : ${els.map(e => `${f0.format(nombre(p.t[e]) * 10 * densite(p))} u ${NOMS[e]}`).join(", ")} par m³ (${els.map(e => `${f1.format(nombre(p.t[e]) * densite(p))} %`).join(", ")} en volume).`;
}

// ce qui bouge pendant la saisie : le bilan en tête de fiche et le titre (le reste garde la main)
function majFiche() {
  const o = objetFiche(), pe = prixUnite(), b = $("#feuille [data-bilan]");
  if (fiche.genre === "min" || fiche.genre === "org") $("#feuille-titre").textContent = o.nom || (fiche.genre === "min" ? "Nouvel engrais" : "Nouvel organique");
  if (!b) return;
  document.querySelectorAll("#feuille [data-volume]").forEach(a => {
    const x = a.dataset.volume ? etat.refs[fiche.id].produits.find(r => r.id === a.dataset.volume) : o;
    if (x) a.textContent = texteVolume(x);
  });
  if (fiche.genre === "min") b.innerHTML = bilanMineral(o, pe);
  else if (fiche.genre === "org") {
    b.innerHTML = bilanOrganique(o, pe);
    const h = humusOrganique(o), a = $("#feuille [data-humus-aide]");
    a.textContent = h ? `${f0.format(h.kg)} kg d'humus stable par ${parU(o)}, comptés ${f1.format(h.euros)} € à ${f2.format(nombre(etat.humus) || 0)} € les 100 kg (réglage dans « Prix de l'unité »).`
      : "Vide : la valeur de son type, en gris. Sans matière organique ni K1, son humus n'est pas compté.";
  }
  else if (fiche.genre === "el") b.innerHTML = bilanElement(fiche.id, pe);
  else if (fiche.genre === "humus") b.innerHTML = bilanHumus();
  else if (fiche.genre === "paille") b.innerHTML = bilanPaille(fiche.id);
}

function tableDetail(lignes, total, avecPart, humus) {
  return `<table class="detail"><tbody>${lignes.map(l => `<tr><td><span class="el-titre" style="--c:${COULEURS[l.e]}">${NOMS[l.e]}</span>${avecPart && l.part !== 100 ? ` <span class="doux">(${f0.format(l.part)} %)</span>` : ""}</td>
    <td>${f1.format(l.u)} u</td><td>× ${f2.format(l.pu)} €</td><td>${f1.format(l.euros)} €</td></tr>`).join("")}
    ${humus ? `<tr><td><span class="el-titre" style="--c:var(--humus)">Humus</span></td><td>${f0.format(humus.kg)} kg</td><td>× ${f2.format((nombre(etat.humus) || 0) / 100)} €</td><td>${f1.format(humus.euros)} €</td></tr>` : ""}
    <tr class="total"><td>Valeur réelle</td><td></td><td></td><td>${f1.format(total)} €</td></tr></tbody></table>`;
}

function bilanMineral(p, pe) {
  const r = valeurMineral(p, pe), prix = nombre(p.prix);
  if (!Object.keys(unitesMineral(p)).length) return '<p class="aide-champ">Saisis ses teneurs (ou choisis un engrais courant) pour voir sa valeur réelle.</p>';
  if (r.manque) return `<div>${pastilleManque(r.manque)}</div><p class="aide-champ">Il manque le prix de l'unité de cet élément : donne un prix à son engrais de référence, dans « Prix de l'unité ».</p>`;
  const u = Object.entries(r.unites), pt = prixTonne(p), ec = ecartMineral(pt, r.valeur), f = facteur(p), up = uPrix(p);
  return `<div class="haut"><div><div class="etiq">Valeur réelle</div><div class="grand">${f0.format(r.valeur * f)}<small>€/${up}</small></div></div>
      <div style="text-align:right"><div class="etiq">Tu le paies</div><div class="grand">${prix !== null ? f0.format(prix) : "—"}<small>€/${up}</small></div></div></div>
    <div>${prix !== null ? pastilleEcart(ec) : '<span class="pastille att">prix à saisir</span>'}${u.length === 1 && prix !== null ? ` <span class="doux" style="font-size:.88rem">soit ${f2.format(pt / u[0][1])} €/u ${NOMS[u[0][0]]}</span>` : ""}</div>
    ${tableDetail(r.lignes.map(l => ({...l, u: l.u * f, euros: l.euros * f})), r.valeur * f, false)}
    ${auM3(p) ? `<p class="aide-champ" style="margin-top:-4px">Pour 1 m³, soit ${f2.format(f)} t.</p>` : ""}`;
}

// la charpente commune des fiches : une rubrique (titre, contenu, aide), un choix en boutons, la suppression en pied
const IC_SUPPR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const IC_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const rubrique = (titre, contenu, aide = "") => `<section class="groupe"><h3>${titre}</h3>${contenu}${aide ? `<p class="aide-champ">${aide}</p>` : ""}</section>`;
const choix = (attr, options, valeur, titre) => `<div class="champ"><span>${titre}</span><div class="seg large" role="group" aria-label="${titre}">${options.map(([k, t]) => `<button data-${attr}="${k}" aria-pressed="${valeur === k}">${t}</button>`).join("")}</div></div>`;
const piedSuppr = texte => `<div class="pied-fiche"><button class="btn danger bloc" data-supprime>${IC_SUPPR}${texte}</button></div>`;
const PRIX_PAR = [["t", "€/t"], ["m3", "€/m³"]];

function ficheMineral(p) {
  const options = COURANTS.map((c, i) => `<option value="${i}">${echap(c.nom)} · ${echap(formule(c.t))}</option>`).join("");
  return `<div class="bilan" data-bilan aria-live="polite"></div>
    ${rubrique("Engrais", `<div class="champs">
      <label class="champ large"><span>Remplir avec un engrais courant</span><select id="c-courant" data-courant ${fiche.neuf ? "data-premier" : ""}><option value="">Choisir…</option>${options}</select></label>
      ${champ({cle: "nom", titre: "Nom", val: p.nom, num: false, large: true})}</div>`)}
    ${rubrique("Prix livré", `<div class="champs">
      ${champ({cle: "prix", titre: "Prix", val: p.prix, u: `€/${uPrix(p)}`})}
      ${choix("prixpar", PRIX_PAR, auM3(p) ? "m3" : "t", "Payé par")}
      ${auM3(p) ? champ({cle: "densite", titre: "Densité", val: p.densite, u: "t/m³", ph: champTxt(DENSITE_DEFAUT)}) : ""}
      ${auM3(p) ? `<p class="aide-champ" data-volume style="align-self:end"></p>` : ""}</div>`, auM3(p) ? "" : "Un liquide payé au m³ : choisis €/m³, la densité ramène son prix à la tonne.")}
    ${rubrique("Teneurs <small>% du poids</small>", `<div class="champs trois">${champsTeneurs(p.t, "%")}</div>`)}
    ${piedSuppr("Supprimer cet engrais")}`;
}

function bilanOrganique(o, pe) {
  const u = parU(o);
  if (!ELEMENTS.some(e => nombre(o.t[e]) > 0)) return '<p class="aide-champ">Saisis ses teneurs (ton bulletin d\'analyse fait foi) pour voir sa valeur.</p>';
  const rp = valeurOrganique(o, pe, "printemps"), ra = valeurOrganique(o, pe, "automne");
  if (rp.manque) return `<div>${pastilleManque(rp.manque)}</div><p class="aide-champ">Il manque le prix de l'unité de cet élément : donne un prix à son engrais de référence, dans « Prix de l'unité ».</p>`;
  const cout = (nombre(o.prix) || 0) + (nombre(o.epandage) || 0), avecPrix = nombre(o.prix) !== null || nombre(o.epandage) !== null, dose = nombre(o.dose);
  const bloc = (titre, r) => `<div><div class="etiq">${titre}</div><div class="grand">${f1.format(r.valeur)}<small>€/${u}</small></div>
    ${avecPrix ? pastilleGain(r.valeur - cout, u) : ""}${dose ? `<span class="doux" style="font-size:.86rem">${f0.format(r.valeur * dose)} €/ha à ${f1.format(dose)} ${u}</span>` : ""}</div>`;
  return `<div class="deux">${bloc("Épandu au printemps", rp)}${bloc("Épandu à l'automne", ra)}</div>
    <div class="doux" style="font-size:.88rem">Coût ${f1.format(cout)} €/${u} (produit + épandage)${dose ? `, soit ${f0.format(cout * dose)} €/ha` : ""}. ${rp.humus ? `Dont humus ${f1.format(rp.humus.euros)} €/${u}. ` : ""}Si tout comptait : ${f1.format(rp.plein)} €/${u}.</div>
    ${tableDetail(rp.lignes, rp.valeur, true, rp.humus)}<p class="aide-champ" style="margin-top:-4px">Détail au printemps ; entre parenthèses, la part efficace.</p>`;
}

function ficheOrganique(o) {
  const ty = TYPE[o.type] || {}, u = parU(o);
  return `<div class="bilan" data-bilan aria-live="polite"></div>
    ${rubrique("Produit", `<div class="champs">
      <label class="champ large"><span>Type</span><select id="c-type" data-k="type" ${fiche.neuf ? "data-premier" : ""}><option value="">Autre type</option>${TYPES.map(t => `<option value="${t.type}" ${o.type === t.type ? "selected" : ""}>${echap(t.nom)}</option>`).join("")}</select></label>
      ${champ({cle: "nom", titre: "Nom", val: o.nom, num: false})}
      ${choix("unite", [["t", "Tonne"], ["m3", "m³"]], o.unite === "m3" ? "m3" : "t", "Compté par")}</div>`)}
    ${rubrique("Prix et dose", `<div class="champs">
      ${champ({cle: "prix", titre: "Prix du produit", val: o.prix, u: `€/${u}`, ph: "0"})}
      ${champ({cle: "epandage", titre: "Épandage", val: o.epandage, u: `€/${u}`, ph: "0"})}
      ${champ({cle: "dose", titre: "Dose prévue (facultatif)", val: o.dose, u: `${u}/ha`, large: true})}</div>`)}
    ${rubrique(`Teneurs <small>kg par ${u}</small>`, `<div class="champs trois">${champsTeneurs(o.t, `kg/${u}`)}</div>`, "Ton bulletin d'analyse fait foi.")}
    ${rubrique("Humus", `<div class="champs">
      ${champ({cle: "mo", titre: "Matière organique", val: o.mo, u: `kg/${u}`, ph: ty.mo != null ? String(ty.mo) : ""})}
      ${champ({cle: "k1", titre: "Part en humus (K1)", val: o.k1, u: "%", ph: ty.k1 != null ? String(ty.k1) : ""})}</div>
      <p class="aide-champ" data-humus-aide></p>`)}
    <details class="plus"><summary>Parts efficaces la 1re année ${ty.nom ? `(${echap(ty.nom.toLowerCase())})` : ""}</summary>
      <div class="champs">
        ${champ({cle: "eff_printemps", titre: "Azote, au printemps", val: o.eff_printemps, u: "%", ph: String(ty.printemps ?? 100)})}
        ${champ({cle: "eff_automne", titre: "Azote, à l'automne", val: o.eff_automne, u: "%", ph: String(ty.automne ?? 100)})}
        ${champ({cle: "eff_p2o5", titre: "P₂O₅", val: o.eff_p2o5, u: "%", ph: String(ty.p2o5 ?? 100)})}
        ${champ({cle: "eff_k2o", titre: "K₂O", val: o.eff_k2o, u: "%", ph: String(ty.k2o ?? 100)})}</div>
      <p class="aide-champ" style="margin-top:8px">Vide : la valeur du type, en gris (références COMIFER, ±30 %). MgO et SO₃ comptent en entier.</p></details>
    ${piedSuppr("Supprimer cet organique")}`;
}

function bilanElement(e, pe) {
  const d = pe[e];
  if (!d) return '<div class="grand">—</div><p class="aide-champ">Donne un prix et ses teneurs à au moins un engrais de référence, ci-dessous.</p>';
  const plusieurs = d.sources.length > 1;
  return `<div><div class="etiq">Prix de l'unité${plusieurs ? ` · ${d.mini ? "le moins cher" : "moyenne"}` : ""}</div><div class="grand">${f2.format(d.prix)}<small>€ par kg de ${NOMS[e]}</small></div></div>
    <table class="detail"><tbody>${d.sources.map(s => `<tr><td>${echap(s.nom || "Sans nom")}${plusieurs && d.mini && s.x === Math.min(...d.sources.map(o => o.x)) ? ' <span class="pastille ref">retenu</span>' : ""}<br><span class="doux">${s.calcul}</span></td><td>${f2.format(s.x)} €</td></tr>`).join("")}</tbody></table>
    ${d.attente ? `<p class="aide-champ">${d.attente} engrais en attente : un de ses autres éléments n'a pas encore de prix.</p>` : ""}`;
}

// un engrais de référence : la même présentation qu'une fiche d'engrais, en carte
function carteReference(r) {
  const p = `r${r.id}`, champR = (k, titre, u, ph = "", num = true) =>
    `<label class="champ"><span>${titre}</span>${u ? '<span class="avec-u">' : ""}<input id="c-${p}-${k}" data-k="${k}" ${num ? 'class="num" inputmode="decimal"' : ""} value="${echap(champTxt(r[k]))}" placeholder="${echap(ph)}"${placeU(u)} autocomplete="off">${u ? `<i>${u}</i></span>` : ""}</label>`;
  return `<div class="refp" data-ref="${r.id}">
      <div class="refp-tete"><b>${echap(r.nom || "Nouvel engrais")}</b><button class="btn danger petit" data-retire-ref="${r.id}" aria-label="Supprimer ${echap(r.nom || "cet engrais")} des références">${IC_SUPPR}Supprimer</button></div>
      <div class="champs">
        <div class="large">${champR("nom", "Nom", "", "", false)}</div>
        ${champR("prix", "Prix", `€/${uPrix(r)}`, "—")}
        ${choix("prixpar", PRIX_PAR, auM3(r) ? "m3" : "t", "Payé par")}
        ${auM3(r) ? `${champR("densite", "Densité", "t/m³", champTxt(DENSITE_DEFAUT))}<p class="aide-champ" data-volume="${r.id}" style="align-self:end"></p>` : ""}</div>
      <details class="plus"><summary>Teneurs <span class="formule">${echap(formule(r.t) || "à saisir")}</span></summary>
        <div class="champs trois">${champsTeneurs(r.t, "%", p)}</div></details></div>`;
}

function ficheElement(e) {
  const x = objetFiche(), courants = COURANTS.map((c, i) => [c, i]).filter(([c]) => nombre(c.t[e]) > 0);
  return `<div class="bilan" data-bilan aria-live="polite"></div>
    ${rubrique("Avec plusieurs engrais", choix("calcul", Object.entries(CALCULS), x.calcul, "Le prix de l'unité est"),
      x.calcul === "mini" ? "Le moins cher : le prix que tu paierais en achetant au mieux." : "La moyenne : un prix de marché, qu'une promotion ne fait pas plonger.")}
    ${rubrique(`Engrais de référence <small>${x.produits.length}</small>`, `<div class="refs">${x.produits.map(carteReference).join("") || '<p class="aide-champ">Aucun : ajoutes-en un ci-dessous.</p>'}</div>
      <label class="champ"><span>${IC_PLUS.replace("<svg", '<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')}Ajouter un engrais de référence</span><select id="c-ajout-ref" data-ajout-ref><option value="">Choisir…</option>
        ${courants.map(([c, i]) => `<option value="${i}">${echap(c.nom)} · ${echap(formule(c.t))}</option>`).join("")}<option value="autre">Autre engrais (à saisir)</option></select></label>`,
      "Le prix que tu paies, ou celui d'un tarif (coop, négoce, site internet).")}`;
}

function bilanPaille(cle) {
  const c = PAILLES.find(x => x.cle === cle), r = paille(c), compte = etat.paille.compte;
  const lignes = r.lignes.map(l => `<tr><td><span class="el-titre" style="--c:${COULEURS[l.e]}">${NOMS[l.e]}</span></td><td>${f1.format(l.u)} u</td><td>× ${f2.format(l.pu)} €</td><td>${f1.format(l.euros)} €</td></tr>`).join("");
  return `<div class="haut"><div><div class="etiq">Prix plancher</div><div class="grand">${f0.format(r.total)}<small>€/t</small></div></div>
      ${r.t ? `<div style="text-align:right"><div class="etiq">À ${f1.format(r.t)} t/ha</div><div class="grand">${f0.format(r.total * r.t)}<small>€/ha</small></div></div>` : ""}</div>
    ${r.manque.length ? `<div>${pastilleManque(r.manque)}</div>` : ""}
    <table class="detail"><tbody>${lignes}
      ${compte.humus ? `<tr><td><span class="el-titre" style="--c:var(--humus)">Humus</span></td><td>${f0.format(r.humusKg)} kg</td><td>× ${f2.format((nombre(etat.humus) || 0) / 100)} €</td><td>${f1.format(r.humus)} €</td></tr>` : ""}
      ${compte.N && r.azote ? `<tr><td><span class="el-titre" style="--c:var(--n)">Azote bloqué</span></td><td>${PAILLE_N} u</td><td>× ${f2.format(prixUnite().N.prix)} €</td><td>−${f1.format(-r.azote)} €</td></tr>` : ""}
      <tr class="total"><td>Ce qu'elle rend enfouie</td><td></td><td></td><td>${f1.format(r.total)} €</td></tr></tbody></table>
    <p class="aide-champ">Sous ${f0.format(r.total)} €/t (paille sur pied ou à l'andain, pressage à la charge de l'acheteur), la garder rapporte plus que la vendre.</p>`;
}

function fichePaille(cle) {
  const c = PAILLES.find(x => x.cle === cle), reg = objetFiche();
  const champP = (k, titre, u, ph) => champ({cle: k, titre, val: reg[k], u, ph: champTxt(ph)});
  return `<div class="bilan" data-bilan aria-live="polite"></div>
    ${rubrique("Tonnage", `<div class="champs">${champP("t", "Paille exportée", "t/ha", c.t ?? "")}</div>`, c.t ? "" : "Rarement pressée : donne un tonnage pour voir la valeur à l'hectare.")}
    ${rubrique("Teneurs <small>kg par t de paille</small>", `<div class="champs trois">
      ${champP("P2O5", "P₂O₅", "kg/t", c.P2O5)}${champP("K2O", "K₂O", "kg/t", c.K2O)}${champP("MgO", "MgO", "kg/t", c.MgO)}
      ${champP("humus", "Humus stable", "kg/t", PAILLE_HUMUS)}</div>`, "Vide : la valeur de référence, en gris (COMIFER 2007 pour P, K, MgO ; humus : K1 0,15 de la matière sèche, Arvalis/Onidol). Ce qui compte se règle sur la page Paille, pour toutes les cultures.")}`;
}

function bilanHumus() {
  const h = nombre(etat.humus) || 0;
  return `<div><div class="etiq">Valeur de l'humus stable</div><div class="grand">${f2.format(h)}<small>€ pour 100 kg</small></div></div>
    <p class="aide-champ">${h ? `Soit ${f0.format(h * 10)} € la tonne d'humus stable. Un fumier de bovin (200 kg de matière organique par t, K1 67 %) en fait 134 kg par t : ${f1.format(1.34 * h)} € par t.` : "À 0, l'humus n'est pas compté : seuls les éléments font la valeur des organiques."}</p>`;
}

function ficheHumus() {
  return `<div class="bilan" data-bilan aria-live="polite"></div>
    ${rubrique("Valeur", `<div class="champs">${champ({cle: "humus", titre: "Humus stable", val: etat.humus, u: "€/100 kg", ph: "0", large: true})}</div>`,
      "Par défaut 5 € pour 100 kg (40 à 50 € la tonne, Chambre d'agriculture de la Vienne 2022, d'après le prix des produits organiques), comme dans Tournière. 0 : l'humus n'est pas compté.")}
    ${rubrique("Comment il se compte", "", "Humus stable d'un organique = sa matière organique × la part qui fait de l'humus (coefficient isohumique K1, SIMEOS-AMG 2019 : fumier de bovin 67 %, compost 72 %, digestat 63 %, lisier de porc 51 %…). Chaque fiche organique reprend celle de son type, que tu peux remplacer par ton bulletin d'analyse.")}`;
}

function ficheMenu() {
  return `<div class="menu">
    <button class="btn" data-action="exporter">Enregistrer dans un fichier<small>&nbsp;· pour les garder ou les passer à quelqu'un</small></button>
    <button class="btn" data-action="importer">Ouvrir un fichier<small>&nbsp;· enregistré par cette page</small></button>
    <button class="btn" data-action="methode">Comment c'est calculé</button>
    <button class="btn danger" data-action="exemples" id="b-exemples">Revenir aux exemples</button></div>
    <p class="aide-champ">Tes engrais restent dans ce navigateur, sur cet appareil. Pour les retrouver ailleurs, enregistre-les dans un fichier.</p>
    <p class="aide-champ">Version ${VERSION_APPLI}</p>`;
}

function ficheMethode() {
  return `<div class="prose">
    <h3>Le prix de l'unité</h3>
    <p>Des engrais de référence pour chaque élément. Solution 30 pour l'azote, TSP 45 pour le phosphore, chlorure 60 pour la potasse : prix ÷ unités par tonne (une tonne à 30 % = 300 u). Le soufre se lit sur le sulfate d'ammoniaque une fois son azote payé, la magnésie sur la kiésérite une fois son soufre payé ; un reste négatif compte pour 0. Tous tes engrais se comparent ainsi toujours à la même base.</p>
    <p>Plusieurs engrais de référence pour un élément : chacun donne son prix de l'unité, et l'élément prend leur <b>moyenne</b> (un prix de marché) ou <b>le moins cher</b> (le prix en achetant au mieux), au choix dans sa fiche.</p>
    <p>Les teneurs sont en % du poids. Un liquide payé au m³ se ramène à la tonne : prix au m³ ÷ densité. La « solution 39 » est la solution 30 annoncée au volume : 30 % × densité 1,3 = 390 u d'azote par m³.</p>
    <h3>La valeur réelle</h3>
    <p><b>Minéral</b> : unités par tonne × prix de l'unité, élément par élément. Comparée à son prix : « plus cher » veut dire que tu paies ses unités plus cher qu'en engrais de référence.</p>
    <p><b>Organique</b> : seule la part efficace la 1re année compte. L'azote selon la saison d'épandage, le P₂O₅ à 80 % et le K₂O à 100 % par défaut ; MgO et SO₃ en entier. S'y ajoute son humus stable : matière organique × K1, à la valeur réglée dans « Prix de l'unité ». Le gain compare cette valeur au prix plus l'épandage. « Si tout comptait » donne la valeur de tous ses éléments, plus que ce que la culture en tire l'année de l'apport.</p>
    <h3>La paille exportée</h3>
    <p>Ce qu'elle rendrait enfouie, par tonne : P₂O₅, K₂O et MgO (COMIFER 2007) au prix de l'unité, seulement si ton sol en manque ; son humus stable (130 kg par t) à la valeur de l'humus ; moins l'azote que son enfouissement bloque (5 u par t). Sous ce prix, la garder rapporte plus que la vendre. Le même calcul que le prix plancher de la paille de Tournière.</p>
    <p class="doux">Parts d'azote efficace par type : références COMIFER (Keq), arrondies, ±30 %. Le bulletin d'analyse de ton produit fait foi pour les teneurs.</p></div>`;
}

// ---------------------------------------------------------------- message en bas
let minuterie = null;
function message(texte, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${echap(texte)}</span>${action ? `<button id="toast-action">${echap(action.titre)}</button>` : ""}`;
  t.hidden = false;
  if (action) $("#toast-action").onclick = () => { action.faire(); t.hidden = true; };
  clearTimeout(minuterie);
  minuterie = setTimeout(() => { t.hidden = true; }, action ? 6000 : 3000);
}

// ---------------------------------------------------------------- actions
function supprimer() {
  const genre = fiche.genre, o = objetFiche(), liste = genre === "min" ? etat.mineraux : etat.organiques, i = liste.indexOf(o);
  liste.splice(i, 1);
  sauver();
  fiche = null;
  $("#voile").hidden = true;
  document.body.style.overflow = "";
  dessiner();
  message(`« ${o.nom || "Sans nom"} » supprimé`, {titre: "Annuler", faire: () => { liste.splice(i, 0, o); sauver(); dessiner(); }});
}

function ajouter(genre) {
  const o = genre === "min" ? {id: nouvelId(), nom: "", t: {}, prix: ""}
    : {id: nouvelId(), nom: "", type: "", unite: "t", t: {}, prix: "", epandage: ""};
  (genre === "min" ? etat.mineraux : etat.organiques).push(o);
  sauver();
  ouvrir(genre, o.id, true);
}

async function exporter() {
  const nomFichier = `engrais-${new Date().toISOString().slice(0, 10)}.json`, texte = JSON.stringify(etat, null, 1);
  // dans claude.ai : le téléchargement passe par la plateforme ; ouvert depuis le PC : un lien ordinaire
  if (window.claude && window.claude.use) {
    const dl = await window.claude.use("downloads").catch(() => null);
    if (!dl) { message("L'enregistrement n'est pas disponible ici."); return; }
    try { await dl.save({filename: nomFichier, data: texte}); message("Fichier enregistré"); }
    catch (e) { if (!e || e.code !== "declined") message("L'enregistrement n'a pas pu se faire."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texte], {type: "application/json"}));
  a.download = nomFichier;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let armeExemples = null;
function exemples(bouton) {
  if (!armeExemples) {     // deux temps : la page ne peut pas ouvrir de fenêtre de confirmation
    bouton.classList.add("arme");
    bouton.textContent = "Oui, remplacer mes engrais par les exemples";
    armeExemples = setTimeout(() => { armeExemples = null; if (document.contains(bouton)) { bouton.classList.remove("arme"); bouton.textContent = "Revenir aux exemples"; } }, 5000);
    return;
  }
  clearTimeout(armeExemples);
  armeExemples = null;
  const avant = etat;
  etat = complete(structuredClone(EXEMPLES));
  sauver();
  fermer();
  message("Exemples remis", {titre: "Annuler", faire: () => { etat = avant; sauver(); dessiner(); }});
}

// ---------------------------------------------------------------- écoute
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, [data-ouvre]");
  if (!t) { if (ev.target === $("#voile")) fermer(); return; }
  if (t.dataset.vue) { vue = t.dataset.vue; history.replaceState(null, "", "#" + vue); dessiner(); window.scrollTo(0, 0); return; }
  if (t.dataset.ouvre) { const [g, id] = t.dataset.ouvre.split(":"); ouvrir(g, id); return; }
  if (t.dataset.tri) { tri = t.dataset.tri; ecrire(CLE + "-tri", tri); dessiner(); return; }
  if (t.dataset.compte) { const c = etat.paille.compte; c[t.dataset.compte] = !c[t.dataset.compte]; sauver(); dessiner(); return; }
  if (t.dataset.ajoute) { ajouter(t.dataset.ajoute); return; }
  if (t.hasAttribute("data-ferme")) { fermer(); return; }
  if (t.hasAttribute("data-supprime")) { supprimer(); return; }
  if (t.dataset.unite) { objetFiche().unite = t.dataset.unite; sauver(); dessinerFiche(); return; }
  if (t.dataset.calcul) { objetFiche().calcul = t.dataset.calcul; sauver(); dessinerFiche(); return; }
  if (t.dataset.prixpar) {
    const carte = t.closest("[data-ref]"), cible = carte ? objetFiche().produits.find(r => r.id === carte.dataset.ref) : objetFiche();
    cible.prixPar = t.dataset.prixpar;
    sauver();
    dessinerFiche();
    const c = $(carte ? `#c-r${cible.id}-prix` : "#c-prix");
    c.scrollIntoView({block: "center"});
    c.focus({preventScroll: true});
    return;
  }
  if (t.dataset.retireRef) {
    const liste = objetFiche().produits, i = liste.findIndex(r => r.id === t.dataset.retireRef), r = liste[i], e = fiche.id;
    liste.splice(i, 1);
    sauver();
    dessinerFiche();
    message(`« ${r.nom || "Sans nom"} » retiré des références`, {titre: "Annuler", faire: () => { etat.refs[e].produits.splice(i, 0, r); sauver(); if (fiche && fiche.genre === "el") dessinerFiche(); else dessiner(); }});
    return;
  }
  if (t.id === "b-menu") { ouvrir("menu"); return; }
  const a = t.dataset.action;
  if (a === "installer") installer();
  else if (a === "recharger-marche") { chargerMarche(); dessiner(); }
  else if (a === "exporter") exporter();
  else if (a === "importer") $("#b-import").click();
  else if (a === "methode") { fiche = {genre: "methode"}; dessinerFiche(); }
  else if (a === "exemples") exemples(t);
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if (!fiche || !el.closest("#feuille")) return;
  if (fiche.genre === "humus") {
    etat.humus = el.value;
  } else if (fiche.genre === "paille") {
    objetFiche()[el.dataset.k] = el.value;
  } else if (fiche.genre === "el") {
    const x = objetFiche();
    if (el.dataset.ajoutRef !== undefined) {
      const c = COURANTS[+el.value], r = {id: nouvelId(), nom: c ? c.nom : "", t: c ? {...c.t} : {[fiche.id]: ""}, prix: "", ...(c && c.densite ? {densite: c.densite} : {})};
      if (!el.value) return;
      x.produits.push(r);
      sauver();
      dessinerFiche();
      const champPrix = $(`#c-r${r.id}-${c ? "prix" : "nom"}`);
      champPrix.scrollIntoView({block: "center"});
      champPrix.focus({preventScroll: true});
      if (!c) champPrix.closest(".refp").querySelector("details").open = true;
      return;
    }
    const r = x.produits.find(y => y.id === el.closest("[data-ref]").dataset.ref);
    if (el.dataset.t) {
      const v = el.value.trim();
      if (v === "") delete r.t[el.dataset.t]; else r.t[el.dataset.t] = v;
      el.closest(".refp").querySelector("summary .formule").textContent = formule(r.t) || "à saisir";
    } else {
      r[el.dataset.k] = el.value;
      if (el.dataset.k === "nom") el.closest(".refp").querySelector(".refp-tete b").textContent = r.nom || "Nouvel engrais";
    }
  } else if (el.dataset.courant !== undefined) {
    const c = COURANTS[+el.value], o = objetFiche();
    if (!c) return;
    o.nom = c.nom;
    o.t = {...c.t};
    if (c.densite) o.densite = c.densite; else { delete o.densite; delete o.prixPar; }
    sauver();
    dessinerFiche();
    $("#c-prix").focus();
    return;
  } else {
    const o = objetFiche();
    if (el.dataset.t) { const v = el.value.trim(); if (v === "") delete o.t[el.dataset.t]; else o.t[el.dataset.t] = v; }
    else if (el.dataset.k === "type") {
      o.type = el.value;
      const ty = TYPE[o.type];
      if (ty && ty.unite && !ELEMENTS.some(e => nombre(o.t[e]) > 0)) o.unite = ty.unite;     // un lisier se compte au m³
      if (ty && !o.nom) o.nom = ty.nom;
      sauver();
      dessinerFiche();
      return;
    } else if (el.dataset.k) o[el.dataset.k] = el.value;
  }
  sauver();
  majFiche();
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && fiche) { ev.preventDefault(); fermer(); }
  if (ev.key === "Enter" && fiche && ev.target.matches("#feuille input:not([type=checkbox])")) {
    // Entrée passe à la case suivante, puis ferme la fiche
    const cases = [...document.querySelectorAll("#feuille input:not([type=checkbox]), #feuille select")];
    const suivante = cases[cases.indexOf(ev.target) + 1];
    ev.preventDefault();
    if (suivante) suivante.focus(); else fermer();
  }
});

$("#b-import").onchange = async ev => {
  const f = ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.mineraux) || !Array.isArray(d.organiques)) throw new Error();
    const avant = etat;
    etat = complete(d);
    sauver();
    fermer();
    message(`${etat.mineraux.length + etat.organiques.length} engrais ouverts`, {titre: "Annuler", faire: () => { etat = avant; sauver(); dessiner(); }});
  } catch (e) {
    message("Ce fichier n'a pas été enregistré par cette page : rien n'a changé.");
  }
};

window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (VUES.includes(h) && h !== vue) { vue = h; dessiner(); }
});

dessiner();

// l'appli installée (GitHub Pages) : son service worker garde la page pour l'ouvrir sans réseau ; jamais dans claude.ai,
// où la page tourne dans un cadre
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && window.self === window.top) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* pas d'appli hors ligne : la page marche quand même */ });
}
</script>
</body>
